name: Feature Request
description: Suggest a new feature or improvement for twtGUI
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea?

  - type: textarea
    id: feature
    attributes:
      label: What would you like to see?
      description: Describe the feature or improvement clearly.
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Why should this be in twtGUI?
      description: What problem does it solve. What would it improve?
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Anything else?
      description: Mockups, examples, prior art, etc.
